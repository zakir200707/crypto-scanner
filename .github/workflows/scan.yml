name: scan

# Runs every ~15 minutes. GitHub's cron is often late or skipped on new repos, so each
# run also queues the next one itself (self-chaining). Disable the workflow to stop both.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore last pick
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Scan
        timeout-minutes: 12
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          mkdir -p state
          python scanner.py --state state/last.txt --wallets state/wallets.json --ntfy "$NTFY_TOPIC"
      - name: Save last pick
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}
      - name: Queue next run in ~15 min
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( 900 - ($(date +%s) - START) ))
          [ "$wait" -gt 0 ] && sleep "$wait"
          waiting=$(gh run list -R "$GITHUB_REPOSITORY" -w scan.yml --limit 20 --json status \
            -q '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting")] | length')
          if [ "$waiting" = "0" ]; then
            gh workflow run scan.yml -R "$GITHUB_REPOSITORY" --ref main
          else
            echo "a run is already queued; not chaining"
          fi
